# ==============================================================================
# ImagineOS — workspace do userspace
# ==============================================================================
#
# O kernel `dreamcore` e o formato DEF não vivem aqui: pertencem ao repositório
# DNU (submódulo/checkout em `dnu/`), que publica um único artefato, o
# `.build/dzImage`. Este workspace contém apenas o que roda no espaço de
# usuário e o que liga o userspace ao kernel:
#
#   imagine-common/abi        contrato binário (cópia de referência do DNU)
#   imagine-common/userland/api      API do userspace
#   imagine-common/userland/runtimes runtimes Rust e C
#
# O ABI é mantido aqui para a libc e o runtime Rust linkarem sem depender do
# checkout do kernel; o DNU é a fonte de verdade do crate (ver
# `dnu/abi/imagineos_abi`), e as duas cópias precisam ser idênticas.

[workspace]
members = [
    "imagine-common/abi",
    "imagine-common/userland/api",
    "imagine-common/userland/runtimes/ImagineRustRuntime",
    "imagine-common/userland/runtimes/ImagineCRuntime",
]
resolver = "2"

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
lto = true
codegen-units = 1
