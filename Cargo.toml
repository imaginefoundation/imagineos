[package]
name = "imagineos"
version = "0.1.0"
edition = "2024"

[workspace]
members = [
    "common/shared/abi",
    "common/userland/api",
    "common/userland/runtimes/ImagineRustRuntime",
    "common/userland/runtimes/ImagineCRuntime",
    "dnu_kernel",
]
resolver = "2"

[dependencies]
limine = "0.5.0"
imagineos_abi = { path = "common/shared/abi" }

[[bin]]
name = "imagineos-dnu-kernel"
path = "dnu_kernel/src/main.rs"
test = false

[features]
kernel-debug = []

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
lto = true
codegen-units = 1
