# ==============================================================================
# ImagineOS — workspace do userspace
# ==============================================================================
#
# O kernel `dreamcore` e o formato DEF não vivem aqui: pertencem ao repositório
# DNU (submódulo/checkout em `dnu/`), que publica um único artefato, o
# `.build/dzImage`. Este workspace contém apenas o que roda no espaço de
# usuário e o que liga o userspace ao kernel:
#
#   imagine-base/userland/api      API do userspace
#   imagine-base/userland/runtimes runtimes Rust e C
#
# O contrato de ABI do kernel vive em `dnu/abi/` (crate `dnu-abi`), que é a
# fonte de verdade para números de syscall e estruturas compartilhadas.

[workspace]
members = [
    "imagine-base/userland/api",
    "imagine-base/userland/runtimes/ImagineRustRuntime",
    "imagine-base/userland/runtimes/ImagineCRuntime",
]
resolver = "2"

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
lto = true
codegen-units = 1
